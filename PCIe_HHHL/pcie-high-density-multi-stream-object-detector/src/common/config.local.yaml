  tcp: true
  latency_ms: 100
  startup_stagger_ms: 50
  width: 1280
  height: 720
  fps: 10
  decoder_buffers: 4
  decoder_input_buffers: 4
  decoder_tuning: throughput-low-latency

pcie:
  queue_size: 256
  buffer_size: 4194304
