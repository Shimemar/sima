# Default profile: 16 x 720p @ 30 FPS.
# Relative model paths use this file; label paths use the Apps root.
model:
  path:  models/yolo26n-det-int8-b1.tar.gz
  labels: examples/object-detection/high-density-multi-stream-object-detector/src/common/coco_label.txt
  decode_type: yolo26

streams:
  - rtsp://10.42.0.1:8554/src1
  - rtsp://10.42.0.1:8554/src2
  - rtsp://10.42.0.1:8554/src3
  - rtsp://10.42.0.1:8554/src4
  - rtsp://10.42.0.1:8554/src5
  - rtsp://10.42.0.1:8554/src6
  - rtsp://10.42.0.1:8554/src7
  - rtsp://10.42.0.1:8554/src8
  - rtsp://10.42.0.1:8554/src9
  - rtsp://10.42.0.1:8554/src10
  - rtsp://10.42.0.1:8554/src11
  - rtsp://10.42.0.1:8554/src12
  - rtsp://10.42.0.1:8554/src13
  - rtsp://10.42.0.1:8554/src14
  - rtsp://10.42.0.1:8554/src15
  - rtsp://10.42.0.1:8554/src16

input:
  codec: h264                # h264/avc or h265/hevc.
  tcp: true
  latency_ms: 100
  drop_on_latency: true
  skip_rtsp_probe: true
  width: 1280
  height: 720
  fps: 30
  decoder_buffers: 8
  decoder_input_buffers: 2
  decoder_tuning: throughput-low-latency

runtime:
  profile: false
  warmup_frames: 30
  initial_detection_timeout_ms: 90000
  stream_detection_timeout_ms: 30000
  no_detection_timeout_ms: 30000

inference:
  workers: 1
  queue_depth: 16
  internal_queue_depth: 1
  max_inflight_per_stream: 1
  max_inflight_total: 8
  min_score: 0.30
  nms_iou: 0.60
  max_detections: 50

output:
  insight:
    host: 10.42.0.1
    video_port_base: 9000
    metadata_port_base: 9100
    max_visible_streams: 16
  video_enabled: true
