# Edit these values for your board/camera before running.
# See README.md Step 3 for the architecture this config drives.

# ── Camera ────────────────────────────────────────────────────────────────────

# USB webcam capture device. Confirm on the DevKit with: v4l2-ctl --list-devices
camera_device=/dev/video96

# Capture resolution/rate. MJPEG is decoded on the CPU (jpegdec), not the SiMa HW
# decoder -- see demo-neat/apps/usb-camera-yolo26m/LEARNING.md for why (measured:
# jpegdec sustains full camera fps, neatdecoder in mjpeg mode does not).
width=1280
height=720
fps=30

# Correct an upside-down camera mount. One of: none | rotate-180 | horizontal-flip | vertical-flip
flip=none

# ── Models ────────────────────────────────────────────────────────────────────

# YOLO11n-seg, head cut before decode (Step 2-4b) + C2PSA attention rewritten to
# Einsum for single-MLA-segment compile (Step 2-5 fix, see README.md Step 3).
# Paths are relative to this app's directory.
yolo_model_path=./export/build/yolo11n-seg_attnfix_cut/yolo11n-seg_attnfix_cut_mpk.tar.gz
yolo_meta_path=./export/yolo11n-seg_attnfix_cut.json

# Minimum decoded "thing" score to keep after NMS.
yolo_score_threshold=0.25

# NMS IoU threshold (per-class greedy NMS, run entirely on CPU -- see README.md).
yolo_nms_iou=0.45

# Maximum instances kept per frame.
yolo_max_det=100

# LRASPP-MobileNetV3 "stuff" model (wall/floor/ceiling/door/other), Step 2-3/2-5.
student_model_path=./export/build/student_lowres/student_lowres_mpk.tar.gz
student_width=512
student_height=384

# Re-run the stuff model every N frames instead of every frame. 1 = every frame
# (this Step 3 baseline). Raising this is a Step 4 optimization, not a Step 3 one --
# stuff (walls/floors) barely moves frame-to-frame, unlike things.
student_interval=1

# ── Panoptic merge ────────────────────────────────────────────────────────────

# A "thing" instance must occupy at least this fraction of its own predicted mask
# in currently-free pixels to be kept (vs. being mostly behind an earlier instance).
overlap_th=0.5

# Drop leftover stuff regions smaller than this many pixels (noise, not real wall/floor).
stuff_min_area=2000

# Overlay blend strength (0=invisible, 1=solid color, no original frame visible).
mask_alpha=0.55

# Do the whole panoptic merge (stuff upsample, mask placement, color blend) at
# frame/N resolution, then upscale once (Step 4 optimization -- see README.md).
# Higher N = faster but blockier masks/contours. 4 took merge_draw from ~340ms to
# ~53ms/frame at 1280x720 with no visible quality loss; try 6 for more headroom.
merge_downscale=6

# ── Output ────────────────────────────────────────────────────────────────────

# Host that receives the H.264 RTP/UDP video stream. REQUIRED.
udp_host=192.168.131.12

# UDP port for the H.264 video stream.
udp_port=5206

# H.264 encoder bitrate.
bitrate_kbps=4000

# ── Pipeline ──────────────────────────────────────────────────────────────────

# Frames to process; 0 runs until Ctrl-C. Use a bounded value for smoke tests:
#   dk ./main.py --config ./config/default.conf --frames 300
frames=0

# Pipeline queue depth for both model Runs (Block overflow policy, not KeepLatest --
# see README.md / CLAUDE.md for why the model's own push/pull queue must not drop).
queue_depth=3

# Seconds between fps log lines. 0 turns it off.
profile_interval=1.0

# Print the generated GStreamer backend pipelines at startup.
print_backend=false

# Diagnostic: replace the camera with any GStreamer fragment that ends producing
# NV12 at width x height (e.g. a looping test JPEG). Leave empty to use the real camera.
source_override=
