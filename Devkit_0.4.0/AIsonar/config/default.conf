# AI SONAR: USBカメラ -> MiDaS v2.1 small 深度推定(MLA) -> ソナー風PPI -> H.264/RTP UDP (Insight) 設定ファイル

# --- カメラ (DevKit の USB カメラ) ---
# Anker PowerConf C200 で確認。USB 再接続で番号が変わることがある (v4l2-ctl --list-devices)。
# C200 はファームウェア側で fps が制限され 1280x720 で約13fps、640x360 で約18fps (tools/camera_fps.py)。
# モデル入力は 256x256 なので 640x360 で十分。MJPEG デコードと縮小の CPU 負荷も半分以下になる。
camera_device=/dev/video0
capture_width=640
capture_height=360
# カメラの水平画角[deg]。方位角の目盛りと扇の開き角になる (FR-05、Webカメラは約60〜70°)。
camera_hfov_deg=65

# --- 深度推定 (MLA) ---
# tools/mla_surgery.py + quantize_compile.py (int8) で作成。CPU(ORT)版との相関 0.99、MLA 約7 ms。
model_path=./assets/midas_v21_small_256_mla_mpk.tar.gz

# --- 距離プロファイル抽出 (FR-03, FR-04) ---
# 深度マップの縦方向で対象にする水平帯 (0=上端, 1=下端)。机や床が写り込むと常に「近い」になるので
# 中央より少し上を既定にしている。
band_top=0.30
band_bottom=0.60
# 方位ビン数 (256 を割り切る値: 16/32/64/128)
bearing_bins=64
# 各ビン内で「最も近い」とみなすパーセンタイル。100=最大値(ノイズに弱い)、90前後が安定。
nearest_percentile=90
# 時間方向 EMA の係数 (1=平滑化なし、小さいほど滑らかだが追従が遅い)
ema_alpha=0.35

# --- 逆深度 -> 距離[m] の換算: range = depth_scale / (inv_depth + depth_shift) ---
# MiDaS の出力は相対逆深度 (スケール・シフト不定) なので、メートル表示は目安。
# `--calibrate` で中央付近の inv_depth を表示させ、既知距離2点 (例 1m と 3m) から解いて合わせる:
#   depth_shift = (r1*d1 - r2*d2) / (r2 - r1),  depth_scale = r1 * (d1 + depth_shift)
depth_scale=1250
depth_shift=245

# --- ソナー描画 (FR-07〜11) ---
max_range_m=4.0
ring_step_m=1.0
# スイープ1往復の秒数 (FR-08)
sweep_period_s=3.0
# エコー残光の半減期 (FR-09)。スイープ片道より長くすると前回の像が残って見える。
echo_half_life_s=1.2
beam_half_life_s=0.25
# エコー円弧の太さ[m]
echo_thickness_m=0.06
# 現在の距離プロファイルを薄い線で重ねる
draw_profile=true

# --- 演出 (Step 4) ---
target_lock=true
# 最近目標がこの距離より近いと PROXIMITY ALERT
alert_range_m=0.7

# --- 出力 (H.264/RTP UDP → Insight) ---
# Insight は 10.42.0.1 の UDP 9000-9047 (チャンネル0=9000) で受ける。他のアプリと重ならない番号を使う。
udp_host=10.42.0.1
udp_port=9000
out_width=1280
out_height=720
out_fps=30
bitrate_kbps=4000
# 左側にカメラ映像・深度マップの小窓を出す (false でソナーのみ全画面)
show_inset=true
