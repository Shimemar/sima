# AI SCOUTER: Webcam -> YOLO26人物検出 -> ByteTrack -> VLM(Qwen3-VL) -> 戦闘力HUD 設定ファイル

# --- webcamキャプチャ (vlm_ngen_demoと同じ実機カメラ設定) ---
# tools/probe_env.py で確認したAnker C200のVideo Captureノード(video1はMetadataノード)。
# 以前のvlm_ngen_demo時は/dev/video16だったが、USB再接続等で番号は変わる。
camera_device=/dev/video0
# none / rotate-180 / horizontal-flip / vertical-flip
camera_flip=none
capture_width=1280
capture_height=720
fallback_fps=30

# --- YOLO26人物検出 ---
# yolo26m: vlm_ngen_demo / test_1080p で実績あり。
# 軽量版の比較: --model ./assets/yolo26n-det-bf16-mla_tess-b1.tar.gz
model_path=./assets/yolo26m-det-bf16-mla_tess-b1.tar.gz
model_width=640
model_height=640
# ByteTrackは低スコア検出も使う(2段目の対応付け)ので、通常の検出アプリ(0.4前後)
# より大幅に低くしている。表示される人物の可否はtrack_*側の閾値で決まる。
score_threshold=0.10
nms_iou=0.60
top_k=100
num_classes=80

# --- ByteTrack ---
# この値以上の検出: 1段目の対応付け(既存トラック/ロスト中トラックと照合)
track_high_thresh=0.50
# low以上high未満の検出: 2段目(1段目で外れた追跡中トラックだけと照合)。
# 遮蔽やブレでスコアが落ちた人物のIDを維持するためのByteTrackの肝。
track_low_thresh=0.10
# どのトラックにも対応しなかった検出から新規トラックを作る最低スコア。
# 新規トラックは2フレーム連続で見えて初めてIDが付く(誤検出でIDを消費しない)。
new_track_thresh=0.60
# 1段目の対応付けで許容する最大コスト(1 - IoU*score)。大きいほど緩い。
match_thresh=0.80
# 見失ったトラックを保持する秒数(フレーム数ではなく秒: VLM実行時にfpsが変動するため)。
# この時間内に再検出されれば同じIDに戻る。
lost_timeout_s=1.5
# true: 生のYOLO検出(低スコア含む)を細い灰色枠で重ねる(閾値調整用)
draw_raw_detections=false

# --- DevKit本体のHDMI出力 (hdmi_out.py、UDP出力と同時に出す) ---
# true: 実行中だけlightdm(デスクトップ)を止めてkmssinkでHUD映像をHDMIに全画面表示し、
# 終了時にlightdmを再開する。モニタ未接続などで開始できなければ警告してUDPのみで続行。
# 注意: プロセスをkill -9すると再開されないので、その時は sudo systemctl start lightdm。
# 注意(TRACKING.md参照): YOLO+VLM+HDMIを25fpsで出し続けるとDevKitがログも残さず瞬断
# リセットした(31〜71秒で3回)。hdmi_max_fps=10 に絞ってからは18分無事。
hdmi_enabled=true
# DevKitのGPU(SiliconMotion)用。kmssinkの自動判定は失敗するので明示が必要。
hdmi_driver=smifb
# HDMIの表示モード。0,0=現在のモード(1920x1080)のまま使う(推奨)。
# 非0はkmssink force-modesettingでの切替だが、smifbは非対応で開始に失敗する
# ("driver does not provide mode settings configuration"、実機確認2026-10-02)。
hdmi_width=0
hdmi_height=0
# HDMIへ送る最大fps(0で制限なし)。VLM+YOLO+HDMIの同時稼働でのDevKitリセット対策。
# 25fps(約207MB/sをPCIe経由でSM768へ)→リセット、10fps(約83MB/s)→18分安定。上げないこと。
hdmi_max_fps=10

# --- 注釈付き映像出力 (H.264/RTP UDP) ---
udp_host=10.42.0.1
udp_port=9000
bitrate_kbps=4000
model_queue_depth=4
# fps計測から除外する起動直後のフレーム数
warmup_frames=20

# 毎フレームのトラック(ID・スコア・bbox)をJSON-linesで記録(起動ごとに上書き)。
# ID切り替わりの事後分析用。空文字で無効化。
track_log=./track_log.jsonl
# エラー・ストール(モデル入力が詰まった/回復した)を時刻付きで即時記録。空文字で無効化。
event_log=./scouter_events.log
# 1秒ごとの温度・基板電力(PMICレール)・ファン・負荷・CMA空きをfsync付きで記録(sysmon.py)。
# 突然のリセット時も直前まで残る。空文字で無効化。
sysmon_log=./sysmon.jsonl
# YOLOモデルからこの秒数まったく出力が無ければ停止する。VLM生成中に5〜6秒の詰まりが
# 実測されているので、それより十分長くする(短いと一時的な詰まりでアプリが落ちる)。
model_stall_timeout_s=30.0

# --- VLM解析 (vlm_worker.py) ---
# false: VLMなし(Step 1のYOLO+ByteTrackのみ)。--no-vlm でも可。
vlm_enabled=true
# true: VLMをロードせず、vlm_dry_run_delay_s秒後に架空の結果を返す(HUD・トリガー確認用。
# VLMの数分かかるロードとCMA消費が無いので何度でも試せる)。--vlm-dry-run でも可。
vlm_dry_run=false
vlm_dry_run_delay_s=6.0
# DevKit上に既にあるVLM。tools/vlm_speed.py の実測(YOLO並走、v3プロンプト、6枚平均):
#   gemma-4-E2B : 3.3s/人(Qwenの約1.8倍速)、YOLOとの競合も小さい → 既定(2026-10-02 ユーザー指定)。
#                 称号がやや説明的で、腕組みを「立っている」と答えポーズボーナスを取りこぼすことがある。
#   Qwen3-VL-4B : 5.9s/人。称号に遊びがあり、ポーズ(腕組み等)の認識が確か。
#                 切り替え: --vlm-model-dir /media/nvme/llima/models/Qwen3-VL-4B-Instruct-GPTQ-a16w4
vlm_model_dir=/media/nvme/llima/models/gemma-4-E2B-it-GPTQ-a16w4
# JSON(4つの数値+pose/item/title/comment)が収まる長さ。足りないとJSONが途中で切れて失敗する。
# v3の1行JSONは実測44〜64トークン。
vlm_max_new_tokens=120
# 解析待ちキューの上限。超えた人物は次のフレーム以降に再挑戦する(取りこぼしではない)。
vlm_max_pending=3
# JSONが壊れていた場合などに同じIDを再解析する上限回数(初回含む)
vlm_max_attempts=2
# VLMに送る条件: ByteTrackで連続して見えたフレーム数(≒安定して写っている)、
# トラックのスコア、フレーム面積に対する人物枠の割合(遠すぎる人は送らない)。
vlm_min_track_hits=8
# 初めて見えてからVLMに送るまでの秒数(HUDはこの間 LOCKING ON を表示)。実機で0.5秒で
# 送っていた時は、まだ画面に入って来る途中・ポーズを取る前の画像で解析されていた。
vlm_min_track_age_s=2.0
vlm_min_score=0.60
vlm_min_area_frac=0.03
# 人物枠の周囲に足す余白(枠の幅/高さに対する割合)と、VLMに送る画像の長辺上限。
# 画像を小さくするほどVLMの前処理(画像トークン数)が減り速くなる。
vlm_crop_margin=0.08
vlm_crop_max_side=512
# VLMプロンプト: 1=README §6そのまま(実機で10刻み・毎回同じ値になり戦闘力が団子になった)
# 2=採点ルール(1点刻み・幅広く・独立に)とポーズ語彙を追加した版
# 3=2と同じ内容を改行なし1行JSON+短いコメントで返させる版(生成86→54トークン、8.6→5.9秒)
# 4=3のキー名を1文字にした版(5.7秒とほぼ同じだが、立っている人を「腕組み」と誤答した)
vlm_prompt_version=3
# VLMワーカースレッドのnice値(0=通常)。検出側のfps低下が大きい場合の実験用。
vlm_worker_nice=0
# VLM結果のJSON-linesログ(起動ごとに空にする)。空文字で無効化。
vlm_results_log=./scouter_results.jsonl

# --- 戦闘力・HUD ---
# README §7の式は最大約18,400で、§8のボス級(30,000+)・測定不能(100,000+)に届かず、線形なので
# 実機の来場者(スコア40〜70)は全員7〜12kに団子になった。
# true: 重み付き平均を指数で写像(1点で+7.7%、10点で約2.1倍。境界は平均≈45強者/61エリート/76ボス/94測定不能)。
# false: READMEの式そのまま。
power_boost=true
# true: ポーズ(ジャンプx1.8〜腕組み・ピースx1.3)と持ち物(x1.1)のボーナスを掛け、HUDに表示する。
# 「ポーズを取ると戦闘力が上がる」展示のインタラクション。倍率表はpower.pyのPOSE_BONUS。
power_bonus=true
# 画像から実測した値をVLMのスコアに混ぜる割合(0で無効)。
#   fashion<-服の色彩の鮮やかさ / confidence<-画面内での大きさ / energy<-ByteTrackで測った動きの速さ
# VLM(4B)は5の倍数でしか答えず同じ組を繰り返すため、人ごとの差を連続値で出す。
# 「動く・近づくと上がる」も展示のインタラクションになる。
power_measure_weight=0.3
# energyの実測: 人物枠内のフレーム間差分(輝度、1/4縮小)の平均を直近energy_window_s秒で平均。
# 枠中心の移動速度は「入場時の枠の伸び」や検出のブレを拾い、その場での身振りを拾えなかった。
# energy = (差分 - noise_floor) / full_scale * 100。値はtrack_log.jsonlの"pm"で校正する。
energy_window_s=1.5
energy_noise_floor=1.5
energy_full_scale=30.0
# false: HUDを描かずID枠だけ(描画コストの比較用)。--no-hud でも可。
hud_enabled=true
# 戦闘力カウントアップ演出の秒数
hud_countup_s=1.5
# ANALYZINGプログレスバーが100%に近づくまでの想定秒数(実測のVLM所要時間に合わせる)
vlm_expected_s=3.5

# 処理フレーム数。0で無限(Ctrl-C/SIGTERMで停止)
frames=0
print_backend=false
